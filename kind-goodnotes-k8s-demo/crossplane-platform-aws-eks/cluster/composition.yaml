apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xeksclusters.platform.aws.goodnotes.io
  labels:
    platform.aws.goodnotes.io/composition-role: owner
    platform.aws.goodnotes.io/revision-review: required
    platform.aws.goodnotes.io/type: eks-cluster
  annotations:
    platform.aws.goodnotes.io/implementation-phase: P4
spec:
  compositeTypeRef:
    apiVersion: platform.aws.goodnotes.io/v1alpha1
    kind: XEKSCluster
  mode: Pipeline
  pipeline:
    - step: render-eks-identity-fargate-and-interruption-infrastructure
      functionRef:
        name: function-kcl
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        spec:
          source: |
            import json

            oxr = option("params").oxr
            ocds = option("params").ocds
            _dxr = option("params").dxr
            params = oxr.spec.parameters

            extra_resources = option("params")?.extraResources or {}
            platform_release_ref = params.platformReleaseRef
            catalog_requirements = {
                apiVersion = "meta.krm.kcl.dev/v1alpha1"
                kind = "ExtraResources"
                requirements = {
                    "platform-release" = {
                        apiVersion = "apiextensions.crossplane.io/v1beta1"
                        kind = "EnvironmentConfig"
                        matchName = platform_release_ref.name
                    }
                }
            }
            platform_release_fetch_complete = "platform-release" in extra_resources
            platform_release_matches = (extra_resources["platform-release"] or []) if platform_release_fetch_complete else []
            platform_release_resolved = platform_release_fetch_complete and len(platform_release_matches) == 1
            _platform_release_data = {}
            _coredns_addon_version = ""
            if platform_release_fetch_complete:
                assert len(platform_release_matches) == 1, "platformReleaseRef must resolve exactly one EnvironmentConfig"
                _platform_release_resource = platform_release_matches[0].Resource
                assert _platform_release_resource?.apiVersion == "apiextensions.crossplane.io/v1beta1", "platformReleaseRef resolved an unsupported apiVersion"
                assert _platform_release_resource?.kind == "EnvironmentConfig", "platformReleaseRef resolved an unsupported kind"
                assert _platform_release_resource?.metadata?.name == platform_release_ref.name, "platformReleaseRef resolved the wrong EnvironmentConfig"
                _platform_release_data = _platform_release_resource?.data or {}
                assert _platform_release_data?.schemaVersion == 1, "platform release schemaVersion must be 1"
                assert _platform_release_data?.kubernetes == params.kubernetesVersion, "platform release kubernetes version is incompatible"
                assert _platform_release_data?.coreDNSAddon == "v1.14.3-eksbuild.3", "platform release CoreDNS add-on is not locked by this Composition revision"
                _coredns_addon_version = _platform_release_data.coreDNSAddon

            cluster_xr_name = oxr.metadata.name
            cluster_name = cluster_xr_name
            environment_name = params.environmentRef.name
            network_name = params.networkRef.name
            namespace = params.managementNamespace
            region = params.region
            provider_config = params.providerConfigRef
            partition = params.access.adminPrincipalArn.split(":")[1]
            account_id = params.access.adminPrincipalArn.split(":")[4]

            ec2_api = "ec2.aws.m.upbound.io/v1beta1"
            eks_api = "eks.aws.m.upbound.io/v1beta1"
            iam_api = "iam.aws.m.upbound.io/v1beta1"
            sqs_api = "sqs.aws.m.upbound.io/v1beta1"
            events_api = "cloudwatchevents.aws.m.upbound.io/v1beta1"
            usage_api = "protection.crossplane.io/v1beta1"

            eks_role_name = environment_name + "-eks-control"
            fargate_role_name = environment_name + "-fargate-pod"
            karpenter_role_name = environment_name + "-karpenter"
            cilium_role_name = environment_name + "-cilium"
            node_role_name = environment_name + "-ec2-node"
            instance_profile_name = node_role_name
            remote_kubeconfig_secret_name = environment_name + "-eks-access"
            queue_name = environment_name + "-karpenter-events"
            spot_rule_name = environment_name + "-spot"
            rebalance_rule_name = environment_name + "-rebalance"
            instance_state_rule_name = environment_name + "-state"
            scheduled_change_rule_name = environment_name + "-health"

            cluster_arn = "arn:" + partition + ":eks:" + region + ":" + account_id + ":cluster/" + cluster_name
            node_role_arn = "arn:" + partition + ":iam::" + account_id + ":role/" + node_role_name
            instance_profile_arn = "arn:" + partition + ":iam::" + account_id + ":instance-profile/" + instance_profile_name
            queue_arn = "arn:" + partition + ":sqs:" + region + ":" + account_id + ":" + queue_name
            spot_rule_arn = "arn:" + partition + ":events:" + region + ":" + account_id + ":rule/" + spot_rule_name
            rebalance_rule_arn = "arn:" + partition + ":events:" + region + ":" + account_id + ":rule/" + rebalance_rule_name
            instance_state_rule_arn = "arn:" + partition + ":events:" + region + ":" + account_id + ":rule/" + instance_state_rule_name
            scheduled_change_rule_arn = "arn:" + partition + ":events:" + region + ":" + account_id + ":rule/" + scheduled_change_rule_name

            owner_labels = {
                "platform.aws.goodnotes.io/managed-by" = "crossplane"
                "platform.aws.goodnotes.io/environment" = environment_name
                "platform.aws.goodnotes.io/cluster" = cluster_name
            }
            common_tags = {
                "managed-by" = "crossplane"
                "platform.aws.goodnotes.io/environment" = environment_name
                "platform.aws.goodnotes.io/cluster" = cluster_name
            }
            cluster_membership_tag = {
                key: "owned" for key in ["kubernetes.io/cluster/" + cluster_name]
            }
            managed_spec = {
                managementPolicies = ["*"]
                providerConfigRef = provider_config
            }

            vpc_selector = {
                matchControllerRef = False
                matchLabels = {
                    "platform.aws.goodnotes.io/network" = network_name
                    "platform.aws.goodnotes.io/resource-role" = "vpc"
                }
                namespace = namespace
            }
            private_subnet_selector = {
                matchControllerRef = False
                matchLabels = {
                    "platform.aws.goodnotes.io/environment" = environment_name
                    "platform.aws.goodnotes.io/network" = network_name
                    "platform.aws.goodnotes.io/resource-role" = "subnet"
                    "platform.aws.goodnotes.io/subnet-visibility" = "private"
                }
                namespace = namespace
            }

            node_security_group_labels = {
                **owner_labels
                "platform.aws.goodnotes.io/resource-role" = "node-security-group"
            }
            node_security_group_selector = {
                matchControllerRef = True
                matchLabels = node_security_group_labels
                namespace = namespace
            }
            node_security_group = {
                apiVersion = ec2_api
                kind = "SecurityGroup"
                metadata = {
                    namespace = namespace
                    annotations = {
                        "krm.kcl.dev/composition-resource-name" = "node-security-group"
                    }
                    labels = node_security_group_labels
                }
                spec = {
                    **managed_spec
                    forProvider = {
                        description = "Dedicated EKS control-plane and Karpenter node security boundary for " + environment_name
                        name = environment_name + "-eks-nodes"
                        region = region
                        revokeRulesOnDelete = True
                        tags = {
                            **common_tags
                            **cluster_membership_tag
                            Name = environment_name + "-eks-nodes"
                            "karpenter.sh/discovery" = environment_name
                        }
                        vpcIdSelector = vpc_selector
                    }
                }
            }
            node_security_group_self_ingress = {
                apiVersion = ec2_api
                kind = "SecurityGroupRule"
                metadata = {
                    namespace = namespace
                    annotations = {
                        "krm.kcl.dev/composition-resource-name" = "node-security-group-self-ingress"
                    }
                    labels = {
                        **owner_labels
                        "platform.aws.goodnotes.io/resource-role" = "node-security-group-rule"
                        "platform.aws.goodnotes.io/rule-scope" = "self-ingress"
                    }
                }
                spec = {
                    **managed_spec
                    forProvider = {
                        description = "Allow traffic only among members of the dedicated cluster security group"
                        fromPort = 0
                        protocol = "-1"
                        region = region
                        securityGroupIdSelector = node_security_group_selector
                        self = True
                        toPort = 0
                        type = "ingress"
                    }
                }
            }
            node_security_group_egress = {
                apiVersion = ec2_api
                kind = "SecurityGroupRule"
                metadata = {
                    namespace = namespace
                    annotations = {
                        "krm.kcl.dev/composition-resource-name" = "node-security-group-egress"
                    }
                    labels = {
                        **owner_labels
                        "platform.aws.goodnotes.io/resource-role" = "node-security-group-rule"
                        "platform.aws.goodnotes.io/rule-scope" = "egress"
                    }
                }
                spec = {
                    **managed_spec
                    forProvider = {
                        cidrBlocks = ["0.0.0.0/0"]
                        description = "Allow required private-subnet egress through the environment NAT path"
                        fromPort = 0
                        protocol = "-1"
                        region = region
                        securityGroupIdSelector = node_security_group_selector
                        toPort = 0
                        type = "egress"
                    }
                }
            }

            eks_role_labels = {
                **owner_labels
                "platform.aws.goodnotes.io/resource-role" = "eks-cluster-role"
            }
            fargate_role_labels = {
                **owner_labels
                "platform.aws.goodnotes.io/resource-role" = "fargate-pod-execution-role"
            }
            karpenter_role_labels = {
                **owner_labels
                "platform.aws.goodnotes.io/resource-role" = "karpenter-controller-role"
            }
            cilium_role_labels = {
                **owner_labels
                "platform.aws.goodnotes.io/resource-role" = "cilium-operator-role"
            }
            node_role_labels = {
                **owner_labels
                "platform.aws.goodnotes.io/resource-role" = "ec2-node-role"
            }

            eks_cluster_role = {
                apiVersion = iam_api
                kind = "Role"
                metadata = {
                    namespace = namespace
                    annotations = {
                        "crossplane.io/external-name" = eks_role_name
                        "krm.kcl.dev/composition-resource-name" = "eks-cluster-role"
                    }
                    labels = eks_role_labels
                }
                spec = {
                    **managed_spec
                    forProvider = {
                        assumeRolePolicy = json.encode({
                            Version = "2012-10-17"
                            Statement = [{
                                Effect = "Allow"
                                Principal = {Service = "eks.amazonaws.com"}
                                Action = "sts:AssumeRole"
                            }]
                        })
                        permissionsBoundary = "arn:" + partition + ":iam::" + account_id + ":policy/" + eks_role_name + "-boundary"
                        description = "Dedicated EKS control-plane role for " + environment_name
                        forceDetachPolicies = True
                        tags = common_tags
                    }
                }
            }
            fargate_pod_execution_role = {
                apiVersion = iam_api
                kind = "Role"
                metadata = {
                    namespace = namespace
                    annotations = {
                        "crossplane.io/external-name" = fargate_role_name
                        "krm.kcl.dev/composition-resource-name" = "fargate-pod-execution-role"
                    }
                    labels = fargate_role_labels
                }
                spec = {
                    **managed_spec
                    forProvider = {
                        assumeRolePolicy = json.encode({
                            Version = "2012-10-17"
                            Statement = [{
                                Effect = "Allow"
                                Principal = {Service = "eks-fargate-pods.amazonaws.com"}
                                Action = "sts:AssumeRole"
                                Condition = {
                                    ArnLike = {
                                        "aws:SourceArn" = "arn:" + partition + ":eks:" + region + ":" + account_id + ":fargateprofile/" + cluster_name + "/*"
                                    }
                                }
                            }]
                        })
                        permissionsBoundary = "arn:" + partition + ":iam::" + account_id + ":policy/" + fargate_role_name + "-boundary"
                        description = "Fargate Pod execution role restricted to the environment cluster"
                        forceDetachPolicies = True
                        tags = common_tags
                    }
                }
            }
            ec2_node_role = {
                apiVersion = iam_api
                kind = "Role"
                metadata = {
                    namespace = namespace
                    annotations = {
                        "crossplane.io/external-name" = node_role_name
                        "krm.kcl.dev/composition-resource-name" = "ec2-node-role"
                    }
                    labels = node_role_labels
                }
                spec = {
                    **managed_spec
                    forProvider = {
                        assumeRolePolicy = json.encode({
                            Version = "2012-10-17"
                            Statement = [{
                                Effect = "Allow"
                                Principal = {Service = "ec2.amazonaws.com"}
                                Action = "sts:AssumeRole"
                            }]
                        })
                        permissionsBoundary = "arn:" + partition + ":iam::" + account_id + ":policy/" + node_role_name + "-boundary"
                        description = "Karpenter EC2 node role for the Spot-only data plane"
                        forceDetachPolicies = True
                        tags = common_tags
                    }
                }
            }

            attachment_specs = [
                {
                    name = "eks-cluster-policy-attachment"
                    roleLabels = eks_role_labels
                    policyArn = "arn:" + partition + ":iam::aws:policy/AmazonEKSClusterPolicy"
                },
                {
                    name = "fargate-execution-policy-attachment"
                    roleLabels = fargate_role_labels
                    policyArn = "arn:" + partition + ":iam::aws:policy/AmazonEKSFargatePodExecutionRolePolicy"
                },
                {
                    name = "node-worker-policy-attachment"
                    roleLabels = node_role_labels
                    policyArn = "arn:" + partition + ":iam::aws:policy/AmazonEKSWorkerNodePolicy"
                },
                {
                    name = "node-ecr-pull-policy-attachment"
                    roleLabels = node_role_labels
                    policyArn = "arn:" + partition + ":iam::aws:policy/AmazonEC2ContainerRegistryPullOnly"
                },
            ]
            role_policy_attachments = [{
                apiVersion = iam_api
                kind = "RolePolicyAttachment"
                metadata = {
                    namespace = namespace
                    annotations = {
                        "krm.kcl.dev/composition-resource-name" = attachment.name
                    }
                    labels = {
                        **owner_labels
                        "platform.aws.goodnotes.io/resource-role" = "managed-policy-attachment"
                        "platform.aws.goodnotes.io/attachment" = attachment.name
                    }
                }
                spec = {
                    **managed_spec
                    forProvider = {
                        policyArn = attachment.policyArn
                        roleSelector = {
                            matchControllerRef = True
                            matchLabels = attachment.roleLabels
                            namespace = namespace
                        }
                    }
                }
            } for attachment in attachment_specs]

            instance_profile_labels = {
                **owner_labels
                "platform.aws.goodnotes.io/resource-role" = "ec2-node-instance-profile"
            }
            ec2_node_instance_profile = {
                apiVersion = iam_api
                kind = "InstanceProfile"
                metadata = {
                    namespace = namespace
                    annotations = {
                        "crossplane.io/external-name" = instance_profile_name
                        "krm.kcl.dev/composition-resource-name" = "ec2-node-instance-profile"
                    }
                    labels = instance_profile_labels
                }
                spec = {
                    **managed_spec
                    forProvider = {
                        roleSelector = {
                            matchControllerRef = True
                            matchLabels = node_role_labels
                            namespace = namespace
                        }
                        tags = common_tags
                    }
                }
            }

            eks_cluster_labels = {
                **owner_labels
                "platform.aws.goodnotes.io/resource-role" = "eks-control-plane"
            }
            eks_cluster_selector = {
                matchControllerRef = True
                matchLabels = eks_cluster_labels
                namespace = namespace
            }
            eks_control_plane = {
                apiVersion = eks_api
                kind = "Cluster"
                metadata = {
                    namespace = namespace
                    annotations = {
                        "crossplane.io/external-name" = cluster_name
                        "krm.kcl.dev/composition-resource-name" = "eks-control-plane"
                    }
                    labels = eks_cluster_labels
                }
                spec = {
                    **managed_spec
                    forProvider = {
                        accessConfig = {
                            authenticationMode = "API"
                            bootstrapClusterCreatorAdminPermissions = False
                        }
                        bootstrapSelfManagedAddons = False
                        deletionProtection = params.lifecycle.deletionProtection
                        enabledClusterLogTypes = ["api", "audit", "authenticator", "controllerManager", "scheduler"]
                        region = region
                        roleArnSelector = {
                            matchControllerRef = True
                            matchLabels = eks_role_labels
                            namespace = namespace
                        }
                        tags = {
                            **common_tags
                            **cluster_membership_tag
                            Name = cluster_name
                        }
                        version = params.kubernetesVersion
                        vpcConfig = {
                            endpointPrivateAccess = True
                            endpointPublicAccess = True
                            publicAccessCidrs = params.access.publicAccessCidrs
                            securityGroupIdSelector = node_security_group_selector
                            subnetIdSelector = private_subnet_selector
                        }
                    }
                }
            }

            fargate_profile_labels = {
                **owner_labels
                "platform.aws.goodnotes.io/resource-role" = "karpenter-fargate-profile"
            }
            karpenter_fargate_profile = {
                apiVersion = eks_api
                kind = "FargateProfile"
                metadata = {
                    namespace = namespace
                    annotations = {
                        "crossplane.io/external-name" = "karpenter"
                        "krm.kcl.dev/composition-resource-name" = "karpenter-fargate-profile"
                    }
                    labels = fargate_profile_labels
                }
                spec = {
                    **managed_spec
                    forProvider = {
                        clusterNameSelector = eks_cluster_selector
                        podExecutionRoleArnSelector = {
                            matchControllerRef = True
                            matchLabels = fargate_role_labels
                            namespace = namespace
                        }
                        region = region
                        selector = [{
                            namespace = "karpenter"
                            labels = {
                                "app.kubernetes.io/instance" = "karpenter"
                                "app.kubernetes.io/name" = "karpenter"
                            }
                        }]
                        subnetIdSelector = private_subnet_selector
                        tags = common_tags
                    }
                }
            }

            coredns_addon_labels = {
                **owner_labels
                "platform.aws.goodnotes.io/resource-role" = "coredns-addon"
            }
            coredns_addon = {
                apiVersion = eks_api
                kind = "Addon"
                metadata = {
                    namespace = namespace
                    annotations = {
                        "krm.kcl.dev/composition-resource-name" = "coredns-addon"
                    }
                    labels = coredns_addon_labels
                }
                spec = {
                    **managed_spec
                    forProvider = {
                        addonName = "coredns"
                        addonVersion = _coredns_addon_version
                        clusterNameSelector = eks_cluster_selector
                        preserve = False
                        region = region
                        resolveConflictsOnCreate = "OVERWRITE"
                        resolveConflictsOnUpdate = "PRESERVE"
                        tags = common_tags
                    }
                }
            }

            admin_access_entry_labels = {
                **owner_labels
                "platform.aws.goodnotes.io/resource-role" = "eks-access-entry"
                "platform.aws.goodnotes.io/access-role" = "administrator"
            }
            deployment_access_entry_labels = {
                **owner_labels
                "platform.aws.goodnotes.io/resource-role" = "eks-access-entry"
                "platform.aws.goodnotes.io/access-role" = "deployment"
            }
            node_access_entry_labels = {
                **owner_labels
                "platform.aws.goodnotes.io/resource-role" = "eks-access-entry"
                "platform.aws.goodnotes.io/access-role" = "ec2-node"
            }
            admin_access_entry = {
                apiVersion = eks_api
                kind = "AccessEntry"
                metadata = {
                    namespace = namespace
                    annotations = {
                        "krm.kcl.dev/composition-resource-name" = "admin-access-entry"
                    }
                    labels = admin_access_entry_labels
                }
                spec = {
                    **managed_spec
                    forProvider = {
                        clusterNameSelector = eks_cluster_selector
                        principalArn = params.access.adminPrincipalArn
                        region = region
                        tags = common_tags
                        type = "STANDARD"
                    }
                }
            }
            deployment_access_entry = {
                apiVersion = eks_api
                kind = "AccessEntry"
                metadata = {
                    namespace = namespace
                    annotations = {
                        "krm.kcl.dev/composition-resource-name" = "deployment-access-entry"
                    }
                    labels = deployment_access_entry_labels
                }
                spec = {
                    **managed_spec
                    forProvider = {
                        clusterNameSelector = eks_cluster_selector
                        principalArn = params.access.deploymentPrincipalArn
                        region = region
                        tags = common_tags
                        type = "STANDARD"
                    }
                }
            }
            node_access_entry = {
                apiVersion = eks_api
                kind = "AccessEntry"
                metadata = {
                    namespace = namespace
                    annotations = {
                        "krm.kcl.dev/composition-resource-name" = "node-access-entry"
                    }
                    labels = node_access_entry_labels
                }
                spec = {
                    **managed_spec
                    forProvider = {
                        clusterNameSelector = eks_cluster_selector
                        principalArnFromRoleSelector = {
                            matchControllerRef = True
                            matchLabels = node_role_labels
                            namespace = namespace
                        }
                        region = region
                        tags = common_tags
                        type = "EC2_LINUX"
                    }
                }
            }

            admin_access_policy_association = {
                apiVersion = eks_api
                kind = "AccessPolicyAssociation"
                metadata = {
                    namespace = namespace
                    annotations = {
                        "krm.kcl.dev/composition-resource-name" = "admin-access-policy-association"
                    }
                    labels = {
                        **owner_labels
                        "platform.aws.goodnotes.io/resource-role" = "eks-access-policy-association"
                        "platform.aws.goodnotes.io/access-role" = "administrator"
                    }
                }
                spec = {
                    **managed_spec
                    forProvider = {
                        accessScope = {type = "cluster"}
                        clusterNameSelector = eks_cluster_selector
                        policyArn = "arn:" + partition + ":eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
                        principalArnSelector = {
                            matchControllerRef = True
                            matchLabels = admin_access_entry_labels
                            namespace = namespace
                        }
                        region = region
                    }
                }
            }
            deployment_access_policy_association = {
                apiVersion = eks_api
                kind = "AccessPolicyAssociation"
                metadata = {
                    namespace = namespace
                    annotations = {
                        "krm.kcl.dev/composition-resource-name" = "deployment-access-policy-association"
                    }
                    labels = {
                        **owner_labels
                        "platform.aws.goodnotes.io/resource-role" = "eks-access-policy-association"
                        "platform.aws.goodnotes.io/access-role" = "deployment"
                    }
                }
                spec = {
                    **managed_spec
                    forProvider = {
                        accessScope = {type = "cluster"}
                        clusterNameSelector = eks_cluster_selector
                        policyArn = "arn:" + partition + ":eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
                        principalArnSelector = {
                            matchControllerRef = True
                            matchLabels = deployment_access_entry_labels
                            namespace = namespace
                        }
                        region = region
                    }
                }
            }

            interruption_queue_labels = {
                **owner_labels
                "platform.aws.goodnotes.io/resource-role" = "interruption-queue"
            }
            interruption_queue = {
                apiVersion = sqs_api
                kind = "Queue"
                metadata = {
                    namespace = namespace
                    annotations = {
                        "krm.kcl.dev/composition-resource-name" = "interruption-queue"
                    }
                    labels = interruption_queue_labels
                }
                spec = {
                    **managed_spec
                    forProvider = {
                        messageRetentionSeconds = 300
                        name = queue_name
                        region = region
                        sqsManagedSseEnabled = True
                        tags = common_tags
                        visibilityTimeoutSeconds = 30
                    }
                }
            }

            event_rule_specs = [
                {
                    name = "spot-interruption-rule"
                    externalName = spot_rule_name
                    scope = "spot-interruption"
                    pattern = {
                        source = ["aws.ec2"]
                        "detail-type" = ["EC2 Spot Instance Interruption Warning"]
                    }
                },
                {
                    name = "rebalance-rule"
                    externalName = rebalance_rule_name
                    scope = "rebalance"
                    pattern = {
                        source = ["aws.ec2"]
                        "detail-type" = ["EC2 Instance Rebalance Recommendation"]
                    }
                },
                {
                    name = "instance-state-rule"
                    externalName = instance_state_rule_name
                    scope = "instance-state"
                    pattern = {
                        source = ["aws.ec2"]
                        "detail-type" = ["EC2 Instance State-change Notification"]
                        detail = {
                            state = ["stopping", "stopped", "shutting-down", "terminated"]
                        }
                    }
                },
                {
                    name = "scheduled-change-rule"
                    externalName = scheduled_change_rule_name
                    scope = "scheduled-change"
                    pattern = {
                        source = ["aws.health"]
                        "detail-type" = ["AWS Health Event"]
                    }
                },
            ]
            event_rules = [{
                apiVersion = events_api
                kind = "Rule"
                metadata = {
                    namespace = namespace
                    annotations = {
                        "crossplane.io/external-name" = rule.externalName
                        "krm.kcl.dev/composition-resource-name" = rule.name
                    }
                    labels = {
                        **owner_labels
                        "platform.aws.goodnotes.io/resource-role" = "interruption-event-rule"
                        "platform.aws.goodnotes.io/event-scope" = rule.scope
                    }
                }
                spec = {
                    **managed_spec
                    forProvider = {
                        description = "Karpenter interruption event forwarding for " + rule.scope
                        eventPattern = json.encode(rule.pattern)
                        region = region
