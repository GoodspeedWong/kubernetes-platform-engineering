                    }
                }
                spec = {
                    replayDeletion = True
                    reason = "The EKS cluster must be removed before its dedicated network owner."
                    by = {
                        apiVersion = "platform.aws.goodnotes.io/v1alpha1"
                        kind = "XEKSCluster"
                        resourceRef = {name = cluster_xr_name}
                    }
                    of = {
                        apiVersion = "platform.aws.goodnotes.io/v1alpha1"
                        kind = "XNetwork"
                        resourceRef = {name = network_name}
                    }
                }
            }

            static_resources = [
                node_security_group,
                node_security_group_self_ingress,
                node_security_group_egress,
                eks_cluster_role,
                fargate_pod_execution_role,
                ec2_node_role,
                ec2_node_instance_profile,
                eks_control_plane,
                karpenter_fargate_profile,
                coredns_addon,
                admin_access_entry,
                deployment_access_entry,
                node_access_entry,
                admin_access_policy_association,
                deployment_access_policy_association,
                interruption_queue,
                interruption_queue_policy,
                cluster_uses_network,
            ] + role_policy_attachments + event_rules + event_targets + remote_connection_resources

            usage_edges = [
                {name = "usage-sg-self-ingress-sg", by = node_security_group_self_ingress, of = node_security_group},
                {name = "usage-sg-egress-sg", by = node_security_group_egress, of = node_security_group},
                {name = "usage-cluster-sg", by = eks_control_plane, of = node_security_group},
                {name = "usage-cluster-role", by = eks_control_plane, of = eks_cluster_role},
                {name = "usage-fargate-cluster", by = karpenter_fargate_profile, of = eks_control_plane},
                {name = "usage-fargate-role", by = karpenter_fargate_profile, of = fargate_pod_execution_role},
                {name = "usage-coredns-cluster", by = coredns_addon, of = eks_control_plane},
                {name = "usage-admin-entry-cluster", by = admin_access_entry, of = eks_control_plane},
                {name = "usage-deployment-entry-cluster", by = deployment_access_entry, of = eks_control_plane},
                {name = "usage-node-entry-cluster", by = node_access_entry, of = eks_control_plane},
                {name = "usage-admin-association-entry", by = admin_access_policy_association, of = admin_access_entry},
                {name = "usage-deployment-association-entry", by = deployment_access_policy_association, of = deployment_access_entry},
                {name = "usage-instance-profile-node-role", by = ec2_node_instance_profile, of = ec2_node_role},
                {name = "usage-queue-policy-queue", by = interruption_queue_policy, of = interruption_queue},
            ]
            connection_usage_edges = [
                {name = "usage-remote-kubeconfig-cluster", by = remote_kubeconfig_secret, of = eks_control_plane},
            ] if len(remote_connection_resources) > 0 else []
            attachment_usage_edges = [{
                name = "usage-" + attachment.metadata.annotations["krm.kcl.dev/composition-resource-name"] + "-role"
                by = attachment
                of = {
                    apiVersion = iam_api
                    kind = "Role"
                    metadata = {labels = attachment.spec.forProvider.roleSelector.matchLabels}
                }
            } for attachment in role_policy_attachments]
            target_usage_edges = [{
                name = "usage-" + target.metadata.annotations["krm.kcl.dev/composition-resource-name"] + "-rule"
                by = target
                of = {
                    apiVersion = events_api
                    kind = "Rule"
                    metadata = {labels = target.spec.forProvider.ruleSelector.matchLabels}
                }
            } for target in event_targets] + [{
                name = "usage-" + target.metadata.annotations["krm.kcl.dev/composition-resource-name"] + "-queue"
                by = target
                of = interruption_queue
            } for target in event_targets]
            oidc_usage_edges = [
                {name = "usage-oidc-cluster", by = eks_oidc_provider, of = eks_control_plane}
            ] if _oidc_issuer != "" else []
            irsa_usage_edges = [
                {name = "usage-karpenter-role-oidc", by = karpenter_controller_role, of = eks_oidc_provider},
                {name = "usage-cilium-role-oidc", by = cilium_operator_role, of = eks_oidc_provider},
                {name = "usage-karpenter-policy-role", by = karpenter_controller_policy, of = karpenter_controller_role},
                {name = "usage-karpenter-policy-node-role", by = karpenter_controller_policy, of = ec2_node_role},
                {name = "usage-karpenter-policy-queue", by = karpenter_controller_policy, of = interruption_queue},
                {name = "usage-cilium-policy-role", by = cilium_operator_policy, of = cilium_operator_role},
            ] if _oidc_provider_arn != "" else []
            all_usage_edges = usage_edges + attachment_usage_edges + target_usage_edges + oidc_usage_edges + irsa_usage_edges + connection_usage_edges
            usages = [{
                apiVersion = usage_api
                kind = "Usage"
                metadata = {
                    namespace = namespace
                    annotations = {
                        "krm.kcl.dev/composition-resource-name" = edge.name
                    }
                    labels = {
                        **owner_labels
                        "platform.aws.goodnotes.io/resource-role" = "deletion-order"
                    }
                }
                spec = {
                    replayDeletion = True
                    by = {
                        apiVersion = edge.by.apiVersion
                        kind = edge.by.kind
                        resourceSelector = {
                            matchControllerRef = True
                            matchLabels = edge.by.metadata.labels
                        }
                    }
                    of = {
                        apiVersion = edge.of.apiVersion
                        kind = edge.of.kind
                        resourceSelector = {
                            matchControllerRef = True
                            matchLabels = edge.of.metadata.labels
                        }
                    }
                }
            } for edge in all_usage_edges]

            required_ready_names = [
                "node-security-group", "node-security-group-self-ingress", "node-security-group-egress",
                "eks-cluster-role", "fargate-pod-execution-role", "ec2-node-role",
                "eks-cluster-policy-attachment", "fargate-execution-policy-attachment",
                "node-worker-policy-attachment", "node-ecr-pull-policy-attachment",
                "ec2-node-instance-profile", "eks-control-plane", "karpenter-fargate-profile",
                "admin-access-entry", "deployment-access-entry", "node-access-entry",
                "admin-access-policy-association", "deployment-access-policy-association",
                "interruption-queue", "interruption-queue-policy",
                "spot-interruption-rule", "spot-interruption-target",
                "rebalance-rule", "rebalance-target", "instance-state-rule", "instance-state-target",
                "scheduled-change-rule", "scheduled-change-target",
                "eks-oidc-provider", "karpenter-controller-role", "cilium-operator-role",
                "karpenter-controller-policy", "cilium-operator-policy",
            ]
            _missing_ready_names = [
                name for name in required_ready_names
                if name not in ocds or len([
                    condition for condition in (ocds[name].Resource?.status?.conditions or [])
                    if condition.type == "Ready" and condition.status == "True"
                ]) == 0
            ]
            _observed_fargate = ocds["karpenter-fargate-profile"].Resource?.status?.atProvider if "karpenter-fargate-profile" in ocds else {}
            _eks_control_plane_conditions = ocds["eks-control-plane"].Resource?.status?.conditions or [] if "eks-control-plane" in ocds else []
            _eks_control_plane_ready = len([condition for condition in _eks_control_plane_conditions if condition.type == "Ready" and condition.status == "True"]) > 0
            _native_deletion_protection_observed = _observed_cluster?.deletionProtection
            native_deletion_protection_disabled = _eks_control_plane_ready and _native_deletion_protection_observed == False
            _cluster_api_ready = _connection_material_ready and _oidc_issuer != ""
            _fargate_ready = _observed_fargate?.status == "ACTIVE"
            infrastructure_ready = platform_release_resolved and _cluster_api_ready and _fargate_ready and len(_missing_ready_names) == 0

            _dxr.status = _dxr.status or {}
            _dxr.status.clusterName = cluster_name
            _dxr.status.references = {
                networkRef = params.networkRef
                managementNamespace = namespace
                fargateProfileName = "karpenter"
                instanceProfileName = instance_profile_name
                interruptionQueueName = queue_name
                remoteKubeconfigSecretRef = {
                    namespace = namespace
                    name = remote_kubeconfig_secret_name
                    key = "kubeconfig"
                }
            }
            _dxr.status.actualVersions = _dxr.status?.actualVersions or {}
            if _native_deletion_protection_observed == True or _native_deletion_protection_observed == False:
                _dxr.status.deletionProtectionEnabled = _native_deletion_protection_observed
            if _observed_cluster?.endpoint:
                _dxr.status.endpoint = _observed_cluster.endpoint
            if _certificate_authority_data != "":
                _dxr.status.certificateAuthorityData = _certificate_authority_data
            if _oidc_issuer != "":
                _dxr.status.oidcIssuer = _oidc_issuer
            if _observed_cluster?.version:
                _dxr.status.actualVersions.controlPlane = _observed_cluster.version
            if "coredns-addon" in ocds and ocds["coredns-addon"].Resource?.status?.atProvider?.addonVersion:
                _dxr.status.actualVersions.coreDNSAddon = ocds["coredns-addon"].Resource.status.atProvider.addonVersion
            if "node-security-group" in ocds and ocds["node-security-group"].Resource?.status?.atProvider?.id:
                _dxr.status.references.nodeSecurityGroupId = ocds["node-security-group"].Resource.status.atProvider.id
            if "eks-cluster-role" in ocds and ocds["eks-cluster-role"].Resource?.status?.atProvider?.arn:
                _dxr.status.references.eksControlPlaneRoleArn = ocds["eks-cluster-role"].Resource.status.atProvider.arn
            if "fargate-pod-execution-role" in ocds and ocds["fargate-pod-execution-role"].Resource?.status?.atProvider?.arn:
                _dxr.status.references.fargatePodExecutionRoleArn = ocds["fargate-pod-execution-role"].Resource.status.atProvider.arn
            if "karpenter-controller-role" in ocds and ocds["karpenter-controller-role"].Resource?.status?.atProvider?.arn:
                _dxr.status.references.karpenterControllerRoleArn = ocds["karpenter-controller-role"].Resource.status.atProvider.arn
            if "cilium-operator-role" in ocds and ocds["cilium-operator-role"].Resource?.status?.atProvider?.arn:
                _dxr.status.references.ciliumOperatorRoleArn = ocds["cilium-operator-role"].Resource.status.atProvider.arn
            if "ec2-node-role" in ocds and ocds["ec2-node-role"].Resource?.status?.atProvider?.arn:
                _dxr.status.references.ec2NodeRoleArn = ocds["ec2-node-role"].Resource.status.atProvider.arn
            if "interruption-queue" in ocds and ocds["interruption-queue"].Resource?.status?.atProvider?.arn:
                _dxr.status.references.interruptionQueueArn = ocds["interruption-queue"].Resource.status.atProvider.arn

            infrastructure_condition = {
                type = "InfrastructureReady"
                status = "True" if infrastructure_ready else "False"
                reason = "Available" if infrastructure_ready else ("WaitingForCatalog" if not platform_release_resolved else ("WaitingForEKSAPI" if not _cluster_api_ready else ("WaitingForFargate" if not _fargate_ready else "WaitingForIdentityAndInterruptionInfrastructure")))
                message = "EKS API, identities, Fargate bootstrap, and interruption infrastructure are ready; CoreDNS readiness is evaluated separately." if infrastructure_ready else ("Waiting for the reviewed platformReleaseRef EnvironmentConfig before declaring cluster resources." if not platform_release_resolved else "Waiting for the EKS API, identity, Fargate, access, or interruption resources; CoreDNS Pending does not block this condition.")
            }
            conditions = {
                apiVersion = "meta.krm.kcl.dev/v1alpha1"
                kind = "Conditions"
                conditions = [
                    {
                        target = "Composite"
                        force = True
                        condition = {
                            type = "CatalogResolved"
                            status = "True" if platform_release_resolved else "False"
                            reason = "Available" if platform_release_resolved else "WaitingForPlatformRelease"
                            message = "The referenced platform release catalog was resolved and matches this Composition revision." if platform_release_resolved else "No AWS resources are declared until platformReleaseRef resolves exactly one compatible EnvironmentConfig."
                        }
                    },
                    {
                        target = "Composite"
                        force = True
                        condition = infrastructure_condition
                    },
                    {
                        target = "Composite"
                        force = True
                        condition = {
                            type = "RemoteConnectionMaterialReady"
                            status = "True" if _connection_material_ready else "False"
                            reason = "Available" if _connection_material_ready else "WaitingForEKSAPI"
                            message = "A token-free kubeconfig containing only the observed cluster endpoint, CA, and cluster name is available to the foundation." if _connection_material_ready else "Waiting for an ACTIVE EKS API endpoint and certificate authority; no static bearer token is generated."
                        }
                    },
                    {
                        target = "Composite"
                        force = True
                        condition = {
                            type = "AccountPrerequisitesReady"
                            status = "Unknown"
                            reason = "RequiresAccountOwnerVerification"
                            message = "Account-level Spot/EKS/Fargate service-linked roles, provider credentials, AWS managed policies, quotas, and Git credentials remain external prerequisites."
                        }
                    },
                    {
                        target = "Composite"
                        force = True
                        condition = {
                            type = "RuntimeNetworkUAT"
                            status = "Unknown"
                            reason = "RequiresAWSUAT"
                            message = "Static composition readiness never substitutes for real Fargate-to-EC2, DNS, Service, webhook, and network-policy UAT."
                        }
                    },
                    {
                        target = "Composite"
                        force = True
                        condition = {
                            type = "NativeDeletionProtectionDisabled"
                            status = "True" if native_deletion_protection_disabled else "False"
                            reason = "ObservedDisabled" if native_deletion_protection_disabled else ("UpdatePending" if params.lifecycle.deletionProtection == False else "Protected")
                            message = "The AWS provider observed deletionProtection=false on a Ready EKS control plane." if native_deletion_protection_disabled else ("Waiting for the AWS provider to observe deletionProtection=false; root protection must remain." if params.lifecycle.deletionProtection == False else "Native EKS deletion protection remains enabled.")
                        }
                    },
                ]
            }

            cluster_resources = static_resources + oidc_resources + irsa_resources + usages
            items = [catalog_requirements, *cluster_resources, conditions, _dxr] if platform_release_resolved else [catalog_requirements, conditions, _dxr]
    - step: automatically-detect-ready-cluster-resources
      functionRef:
        name: function-auto-ready
