apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xeksclusters.platform.aws.goodnotes.io
spec:
  group: platform.aws.goodnotes.io
  names:
    kind: XEKSCluster
    plural: xeksclusters
  scope: Cluster
  defaultCompositionUpdatePolicy: Manual
  enforcedCompositionRef:
    name: xeksclusters.platform.aws.goodnotes.io
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - parameters
              properties:
                parameters:
                  type: object
                  required:
                    - access
                    - environmentRef
                    - kubernetesVersion
                    - lifecycle
                    - managementNamespace
                    - networkRef
                    - platformReleaseRef
                    - providerConfigRef
                    - region
                  x-kubernetes-validations:
                    - rule: self.environmentRef == oldSelf.environmentRef
                      message: environmentRef is immutable
                    - rule: self.region == oldSelf.region
                      message: region is immutable; replace the environment to move regions
                    - rule: self.networkRef == oldSelf.networkRef
                      message: networkRef is immutable; replace the environment to change networks
                    - rule: self.providerConfigRef == oldSelf.providerConfigRef
                      message: providerConfigRef is immutable because it is part of cluster identity
                    - rule: self.managementNamespace == oldSelf.managementNamespace
                      message: managementNamespace is immutable
                  properties:
                    environmentRef:
                      type: object
                      description: Owning aggregate environment reference.
                      required:
                        - kind
                        - name
                      properties:
                        kind:
                          type: string
                          enum:
                            - XEKSEnvironment
                        name:
                          type: string
                          minLength: 1
                          maxLength: 63
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    managementNamespace:
                      type: string
                      description: Namespace for every namespaced AWS managed resource created by this XR.
                      default: crossplane-system
                      enum:
                        - crossplane-system
                    region:
                      type: string
                      minLength: 9
                      maxLength: 32
                      pattern: ^[a-z]{2}(-[a-z0-9]+)+-[0-9]+$
                    networkRef:
                      type: object
                      description: Reference to the dedicated network owner; no raw network IDs are accepted.
                      required:
                        - kind
                        - name
                      properties:
                        kind:
                          type: string
                          enum:
                            - XNetwork
                        name:
                          type: string
                          minLength: 1
                          maxLength: 63
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    providerConfigRef:
                      type: object
                      description: Explicit AWS provider identity used by namespaced managed resources.
                      required:
                        - kind
                        - name
                      properties:
                        kind:
                          type: string
                          enum:
                            - ClusterProviderConfig
                        name:
                          type: string
                          minLength: 1
                          maxLength: 63
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    kubernetesVersion:
                      type: string
                      enum:
                        - "1.35"
                    platformReleaseRef:
                      type: object
                      required:
                        - kind
                        - name
                      properties:
                        kind:
                          type: string
                          enum:
                            - EnvironmentConfig
                        name:
                          type: string
                          minLength: 1
                          maxLength: 253
                          pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    access:
                      type: object
                      required:
                        - adminPrincipalArn
                        - deploymentPrincipalArn
                        - publicAccessCidrs
                      x-kubernetes-validations:
                        - rule: self.adminPrincipalArn != self.deploymentPrincipalArn
                          message: administrator and deployment principals must be distinct IAM roles
                      properties:
                        adminPrincipalArn:
                          type: string
                          minLength: 20
                          maxLength: 2048
                          pattern: ^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$
                        deploymentPrincipalArn:
                          type: string
                          minLength: 20
                          maxLength: 2048
                          pattern: ^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$
                        publicAccessCidrs:
                          type: array
                          minItems: 1
                          maxItems: 8
                          x-kubernetes-list-type: set
                          items:
                            type: string
                            pattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$
                          x-kubernetes-validations:
                            - rule: self.all(cidr, cidr != '0.0.0.0/0')
                              message: unrestricted EKS public endpoint access is forbidden
                    lifecycle:
                      type: object
                      required:
                        - deletionProtection
                        - retirementStage
                      x-kubernetes-validations:
                        - rule: self.deletionProtection || self.retirementStage == 'DeleteReady'
                          message: deletionProtection may be disabled only at DeleteReady
                        - rule: "oldSelf.hasValue() ? (self.retirementStage == oldSelf.value().retirementStage || (oldSelf.value().retirementStage == 'Active' && self.retirementStage == 'DrainWorkloads') || (oldSelf.value().retirementStage == 'DrainWorkloads' && self.retirementStage == 'RemoveGitOps') || (oldSelf.value().retirementStage == 'RemoveGitOps' && self.retirementStage == 'DrainCapacity') || (oldSelf.value().retirementStage == 'DrainCapacity' && self.retirementStage == 'RemoveFoundation') || (oldSelf.value().retirementStage == 'RemoveFoundation' && self.retirementStage == 'DeleteReady')) : (self.retirementStage == 'Active' && self.deletionProtection)"
                          message: create at Active with deletion protection, then advance retirement exactly one stage at a time
                          optionalOldSelf: true
                      properties:
                        retirementStage:
                          type: string
                          default: Active
                          enum:
                            - Active
                            - DrainWorkloads
                            - RemoveGitOps
                            - DrainCapacity
                            - RemoveFoundation
                            - DeleteReady
                        deletionProtection:
                          type: boolean
                          default: true
            status:
              type: object
              properties:
                clusterName:
                  type: string
                endpoint:
                  type: string
                certificateAuthorityData:
                  type: string
                  description: Base64-encoded EKS cluster CA published for the dedicated remote ProviderConfigs.
                oidcIssuer:
                  type: string
                  pattern: ^https://.+$
                deletionProtectionEnabled:
                  type: boolean
                references:
                  type: object
                  properties:
                    networkRef:
                      type: object
                      required:
                        - kind
                        - name
                      properties:
                        kind:
                          type: string
                        name:
                          type: string
                    fargateProfileName:
                      type: string
                    instanceProfileName:
                      type: string
                    interruptionQueueName:
                      type: string
                    remoteKubeconfigSecretRef:
                      type: object
                      required:
                        - key
                        - name
                        - namespace
                      properties:
                        key:
                          type: string
                          enum:
                            - kubeconfig
                        name:
                          type: string
                        namespace:
                          type: string
                          enum:
                            - crossplane-system
                    managementNamespace:
                      type: string
                    nodeSecurityGroupId:
                      type: string
                    eksControlPlaneRoleArn:
                      type: string
                    fargatePodExecutionRoleArn:
                      type: string
                    karpenterControllerRoleArn:
                      type: string
                    ciliumOperatorRoleArn:
                      type: string
                    ec2NodeRoleArn:
                      type: string
                    interruptionQueueArn:
                      type: string
                actualVersions:
                  type: object
                  properties:
                    controlPlane:
                      type: string
                    coreDNSAddon:
                      type: string
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                        maxLength: 32768
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      type:
                        type: string
                        minLength: 1
                        maxLength: 316
