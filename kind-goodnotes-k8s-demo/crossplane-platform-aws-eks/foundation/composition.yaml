            apps_role_binding_ready = len([condition for condition in _apps_role_binding_conditions if condition.type == "Ready" and condition.status == "True"]) > 0
            argocd_prerequisites_ready = argocd_release_ready and apps_namespace_ready and apps_role_ready and apps_role_binding_ready

            argocd_project_manifest = {
                apiVersion = "argoproj.io/v1alpha1"
                kind = "AppProject"
                metadata = {
                    name = argocd_project_name
                    namespace = argocd_namespace
                    labels = {
                        "platform.aws.goodnotes.io/environment" = environment_name
                        "platform.aws.goodnotes.io/managed-by" = "crossplane"
                    }
                }
                spec = {
                    clusterResourceBlacklist = [{group = "*", kind = "*"}]
                    destinations = [{namespace = gitops_destination_namespace, server = "https://kubernetes.default.svc"}]
                    namespaceResourceWhitelist = [
                        {group = "", kind = "ConfigMap"},
                        {group = "", kind = "Service"},
                        {group = "", kind = "ServiceAccount"},
                        {group = "apps", kind = "Deployment"},
                        {group = "batch", kind = "Job"},
                        {group = "networking.k8s.io", kind = "NetworkPolicy"},
                    ]
                    orphanedResources = {warn = True}
                    sourceRepos = [params.gitOps.repositoryURL] if gitops_configured else []
                }
            }
            argocd_project = {
                apiVersion = "kubernetes.m.crossplane.io/v1alpha1"
                kind = "Object"
                metadata = {
                    namespace = namespace
                    annotations = {"krm.kcl.dev/composition-resource-name" = "argocd-project"}
                    labels = {
                        **owner_labels
                        "platform.aws.goodnotes.io/resource-role" = "gitops-policy"
                    }
                }
                spec = {
                    managementPolicies = ["*"]
                    providerConfigRef = {kind = "ClusterProviderConfig", name = kubernetes_provider_config_name}
                    forProvider = {manifest = argocd_project_manifest}
                }
            }
            argocd_project_observed = "argocd-project" in ocds or "gitops-bootstrap" in ocds
            argocd_project_stage_open = argocd_stage_open and (argocd_prerequisites_ready or argocd_project_observed)
            argocd_project_resources = [argocd_project] if argocd_project_stage_open else []
            _argocd_project_conditions = ocds["argocd-project"].Resource?.status?.conditions or [] if "argocd-project" in ocds else []
            argocd_project_ready = len([condition for condition in _argocd_project_conditions if condition.type == "Ready" and condition.status == "True"]) > 0

            gitops_bootstrap_manifest = {
                apiVersion = "argoproj.io/v1alpha1"
                kind = "Application"
                metadata = {
                    name = gitops_bootstrap_name
                    namespace = argocd_namespace
                    finalizers = ["resources-finalizer.argocd.argoproj.io/foreground"]
                    annotations = {
                        "platform.aws.goodnotes.io/repository-credentials-secret" = params.gitOps.credentialsSecretRef.name if gitops_configured else ""
                    }
                    labels = {
                        "platform.aws.goodnotes.io/environment" = environment_name
                        "platform.aws.goodnotes.io/managed-by" = "crossplane"
                    }
                }
                spec = {
                    destination = {namespace = gitops_destination_namespace, server = "https://kubernetes.default.svc"}
                    project = argocd_project_name
                    source = {
                        path = params.gitOps.path if gitops_configured else ""
                        repoURL = params.gitOps.repositoryURL if gitops_configured else ""
                        targetRevision = params.gitOps.revision if gitops_configured else ""
                    }
                    syncPolicy = {
                        automated = {allowEmpty = False, prune = True, selfHeal = True}
                        syncOptions = [
                            "CreateNamespace=false",
                            "PruneLast=true",
                            "PrunePropagationPolicy=foreground",
                            "RespectIgnoreDifferences=true",
                        ]
                    }
                }
            }
            gitops_bootstrap = {
                apiVersion = "kubernetes.m.crossplane.io/v1alpha1"
                kind = "Object"
                metadata = {
                    namespace = namespace
                    annotations = {"krm.kcl.dev/composition-resource-name" = "gitops-bootstrap"}
                    labels = {
                        **owner_labels
                        "platform.aws.goodnotes.io/resource-role" = "gitops-bootstrap-spec-owner"
                    }
                }
                spec = {
                    managementPolicies = ["*"]
                    providerConfigRef = {kind = "ClusterProviderConfig", name = kubernetes_provider_config_name}
                    forProvider = {manifest = gitops_bootstrap_manifest}
                    readiness = {
                        policy = "DeriveFromCelQuery"
                        celQuery = "object.status.health.status == 'Healthy' && object.status.sync.status == 'Synced'"
                    }
                }
            }
            gitops_bootstrap_observed = "gitops-bootstrap" in ocds
            gitops_bootstrap_stage_open = gitops_configured and retirement_stage == "Active" and argocd_stage_open and (argocd_project_ready or gitops_bootstrap_observed)
            gitops_bootstrap_resources = [gitops_bootstrap] if gitops_bootstrap_stage_open else []
            _gitops_bootstrap_conditions = ocds["gitops-bootstrap"].Resource?.status?.conditions or [] if "gitops-bootstrap" in ocds else []
            gitops_bootstrap_ready = len([condition for condition in _gitops_bootstrap_conditions if condition.type == "Ready" and condition.status == "True"]) > 0
            foundation_ready = retirement_stage == "Active" and remote_auth_ready and karpenter_ready and cilium_ready and network_approval_valid and argocd_prerequisites_ready and argocd_project_ready and (not gitops_configured or gitops_bootstrap_ready)

            _dxr.status = _dxr.status or {}
            _dxr.status.references = {
                clusterRef = params.clusterRef
                remoteKubeconfigSecretRef = {
                    namespace = namespace
                    name = remote_kubeconfig_secret_name
                    key = "kubeconfig"
                }
                ec2NodeClassName = karpenter_node_class_name
                helmProviderConfigName = helm_provider_config_name
                kubernetesProviderConfigName = kubernetes_provider_config_name
                nodePoolName = karpenter_node_pool_name
                argoCDReleaseName = "argocd"
                appProjectName = argocd_project_name
                bootstrapApplicationName = gitops_bootstrap_name if gitops_configured else ""
            }
            _dxr.status.actualVersions = _dxr.status?.actualVersions or {}
            _dxr.status.retirement = {
                requestedStage = requested_stage
                approvedStage = retirement_stage
                evidenceAccepted = retirement_evidence_valid
                cleanupComplete = retirement_cleanup_complete
                inventorySha256 = expected_inventory_sha[retirement_stage]
            }
            if karpenter_controller_ready:
                _dxr.status.actualVersions.karpenter = karpenter_chart_version
            if ec2_node_class_ready:
                _dxr.status.actualVersions.nodeImage = karpenter_node_image_alias
            if cilium_ready:
                _dxr.status.actualVersions.cilium = cilium_chart_version
            if argocd_release_ready:
                _dxr.status.actualVersions.argoCD = argocd_app_version

            conditions = {
                apiVersion = "meta.krm.kcl.dev/v1alpha1"
                kind = "Conditions"
                conditions = [
                    {
                        target = "Composite"
                        force = True
                        condition = {
                            type = "RemoteAuthenticationReady"
                            status = "True" if remote_auth_ready else "False"
                            reason = "Available" if remote_auth_ready else ("ProbeFailed" if remote_auth_failed else "WaitingForProbe")
                            message = "The observe-only kube-system probe reached the target EKS API using a freshly signed AWS identity token." if remote_auth_ready else ("The observe-only target API probe failed; desired ProviderConfigs and references are retained for recovery." if remote_auth_failed else "Waiting for the cluster-owned endpoint/CA Secret, injected AWS identity, and observe-only target API probe.")
                        }
                    },
                    {
                        target = "Composite"
                        force = True
                        condition = {
                            type = "KarpenterCRDsReady"
                            status = "True" if karpenter_crds_ready else "False"
                            reason = "Available" if karpenter_crds_ready else "WaitingForCRDRelease"
                            message = "The separately owned Karpenter CRD release is ready; controller and v1 custom resources may be declared." if karpenter_crds_ready else "Waiting for the unique Karpenter CRD release owner before declaring the controller, EC2NodeClass, or NodePool."
                        }
                    },
                    {
                        target = "Composite"
                        force = True
                        condition = {
                            type = "KarpenterReady"
                            status = "True" if karpenter_ready else "False"
                            reason = "Available" if karpenter_ready else ("SpotCapacityUnavailable" if spot_capacity_unavailable else ("WaitingForRemoteResources" if karpenter_stage_open else "WaitingForCRDRelease"))
                            message = "The Fargate-hosted controller release, EC2NodeClass, and Spot-only NodePool report Ready." if karpenter_ready else ("The Spot-only capacity declaration remains in place, but AWS has not supplied eligible Spot capacity; no On-Demand or reserved fallback is permitted." if spot_capacity_unavailable else ("Karpenter resources are declared without waiting for CoreDNS, Cilium, or EC2 capacity; waiting for their remote readiness." if karpenter_stage_open else "Karpenter controller and custom resources remain gated only on the CRD release."))
                        }
                    },
                    {
                        target = "Composite"
                        force = True
                        condition = {
                            type = "CiliumDeclared"
                            status = "True" if karpenter_stage_open else "False"
                            reason = "Available" if karpenter_stage_open else "WaitingForKarpenterCRDRelease"
                            message = "The Cilium Release is declared in the same stage as the Spot-only NodePool, so Cilium readiness cannot block capacity declaration." if karpenter_stage_open else "Waiting for the Karpenter CRD release before opening the shared zero-node bootstrap stage."
                        }
                    },
                    {
                        target = "Composite"
                        force = True
                        condition = {
                            type = "CiliumReady"
                            status = "True" if cilium_ready else "False"
                            reason = "Available" if cilium_ready else ("ReleaseFailed" if cilium_failed else ("WaitingForRelease" if karpenter_stage_open else "NotDeclared"))
                            message = "The Cilium ENI/IPAM and kube-proxy-replacement Release reports Ready; runtime network probes remain mandatory." if cilium_ready else ("The Cilium Release reports failure, but the Spot-only NodePool remains declared for recovery." if cilium_failed else ("Cilium is declared and may remain Pending until Spot EC2 capacity exists; this does not retract the NodePool." if karpenter_stage_open else "Cilium has not yet entered the zero-node bootstrap stage."))
                        }
                    },
                    {
                        target = "Composite"
                        force = True
                        condition = {
                            type = "NetworkUATApproved"
                            status = "True" if network_approval_valid else "False"
                            reason = "Approved" if network_approval_valid else ("EvidenceRejected" if network_approval_wrapper_ready else "WaitingForExternalEvidence")
                            message = "An externally produced network UAT record is bound to this environment, cluster, foundation UID/generation, and observed kube-system UID." if network_approval_valid else ("The observed approval record failed its identity, generation, or evidence binding checks." if network_approval_wrapper_ready else "Waiting for the deployment or administrator principal to run U1/U3 probes and create the bound kube-system approval ConfigMap.")
                        }
                    },
                    {
                        target = "Composite"
                        force = True
                        condition = {
                            type = "ArgoCDDeclared"
                            status = "True" if argocd_stage_open else "False"
                            reason = "Available" if argocd_stage_open else ("RetirementInProgress" if not argocd_lifecycle_open else "WaitingForNetworkApproval")
                            message = "The isolated remote Argo CD Release and namespaced business RBAC are declared on Spot capacity." if argocd_stage_open else ("Argo CD is outside the desired retirement stage." if not argocd_lifecycle_open else "Argo CD remains gated until externally approved runtime networking is bound to this foundation generation.")
                        }
                    },
                    {
                        target = "Composite"
                        force = True
                        condition = {
                            type = "ArgoCDReady"
                            status = "True" if argocd_prerequisites_ready and argocd_project_ready else "False"
                            reason = "Available" if argocd_prerequisites_ready and argocd_project_ready else ("WaitingForProject" if argocd_prerequisites_ready else ("WaitingForReleaseAndRBAC" if argocd_stage_open else "NotDeclared"))
                            message = "Argo CD, its apps namespace RoleBinding, and the deny-by-default business AppProject report Ready." if argocd_prerequisites_ready and argocd_project_ready else ("Argo CD is ready but the business AppProject is not yet observed Ready." if argocd_prerequisites_ready else ("Waiting for the Argo CD Release, apps namespace, and namespaced Role/RoleBinding." if argocd_stage_open else "Argo CD has not passed its network gate."))
                        }
                    },
                    {
                        target = "Composite"
                        force = True
                        condition = {
                            type = "GitOpsBootstrapReady"
                            status = "True" if gitops_configured and gitops_bootstrap_ready else ("False" if gitops_configured else "Unknown")
                            reason = "Available" if gitops_configured and gitops_bootstrap_ready else ("WaitingForApplication" if gitops_configured else "NotConfigured")
                            message = "The Crossplane-owned bootstrap Application is Synced and Healthy; Argo CD owns only its authorized business children." if gitops_configured and gitops_bootstrap_ready else ("A controlled Git source is configured; waiting for the bootstrap Application after Argo CD and AppProject readiness." if gitops_configured else "No Git source is configured, so no syncable bootstrap Application exists.")
                        }
                    },
                    {
                        target = "Composite"
                        force = True
                        condition = {
                            type = "FoundationReady"
                            status = "True" if foundation_ready else "False"
                            reason = "Available" if foundation_ready else "WaitingForFoundationComponents"
                            message = "Remote authentication, Spot capacity, Cilium, externally approved network UAT, Argo CD, namespaced RBAC, and the configured GitOps bootstrap are ready." if foundation_ready else "Waiting for one or more foundation components or external runtime evidence; no static condition substitutes for AWS UAT."
                        }
                    },
                    {
                        target = "Composite"
                        force = True
                        condition = {
                            type = "RuntimeNetworkUAT"
                            status = "Unknown"
                            reason = "RequiresAWSUAT"
                            message = "Foundation status cannot prove real token refresh, Fargate-to-EC2, DNS, Service, or policy connectivity."
                        }
                    },
                    {
                        target = "Composite"
                        force = True
                        condition = {
                            type = "RetirementEvidenceAccepted"
                            status = "True" if retirement_evidence_valid else "False"
                            reason = "Accepted" if retirement_evidence_valid else ("EvidenceRejected" if retirement_evidence_wrapper_ready else "WaitingForExternalEvidence")
                            message = "The requested retirement stage is approved by evidence bound to both XR identities, generations, transition, inventory hash, and zero-residual checks." if retirement_evidence_valid else "The requested stage is held at the last approved stage; all resources in that retained inventory remain desired."
                        }
                    },
                    {
                        target = "Composite"
                        force = True
                        condition = {
                            type = "RetirementCleanupComplete"
                            status = "True" if retirement_cleanup_complete else "False"
                            reason = "DeleteReady" if retirement_cleanup_complete else "Protected"
                            message = "Remote foundation and dynamic-capacity inventory is zero and native protection release was explicitly approved." if retirement_cleanup_complete else "Remote authentication, cleanup controllers, native EKS deletion protection, and root protection remain retained."
                        }
                    }
                ]
            }

            remote_connection_owner_resources = [kubernetes_provider_config, helm_provider_config, remote_auth_probe] if remote_connection_stage_open else []
            karpenter_crd_resources = [karpenter_crds_release] if foundation_runtime_stage_open else []
            network_approval_resources = [network_uat_approval] if network_approval_stage_open else []
            foundation_usage_resources = [foundation_uses_cluster] if foundation_usage_stage_open else []

            items = [
                *remote_connection_owner_resources,
                *karpenter_crd_resources,
                *karpenter_post_crd_resources,
                *network_approval_resources,
                *argocd_base_resources,
                *argocd_project_resources,
                *gitops_bootstrap_resources,
                *foundation_usage_resources,
                *retirement_evidence_resources,
                conditions,
                _dxr,
            ]
