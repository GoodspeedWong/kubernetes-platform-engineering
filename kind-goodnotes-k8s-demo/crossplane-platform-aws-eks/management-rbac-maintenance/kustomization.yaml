apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../management-rbac
  - ../../crossplane
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: crossplane
      namespace: crossplane-system
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
