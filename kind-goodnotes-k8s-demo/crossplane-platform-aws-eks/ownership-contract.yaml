  deletionPolicyMapping:
    Delete:
      managementPolicies:
        - '*'
    Orphan:
      managementPolicies:
        - Observe
        - Create
        - Update
        - LateInitialize
  discovery:
    scopeValue: environmentRef.name
    privateSubnetAwsTags:
      - karpenter.sh/discovery
      - kubernetes.io/cluster/<environment>-cluster
      - platform.aws.goodnotes.io/environment
      - platform.aws.goodnotes.io/subnet-visibility
    publicSubnetAwsTags:
      - kubernetes.io/cluster/<environment>-cluster
      - platform.aws.goodnotes.io/environment
      - platform.aws.goodnotes.io/subnet-visibility
    sharedNetworkDiscoveryTagsAllowed: false
    securityGroupOwner: XEKSCluster
    securityGroupImplementationPhase: P4
    securityGroupAwsTags:
      - karpenter.sh/discovery
      - kubernetes.io/cluster/<environment>-cluster
      - platform.aws.goodnotes.io/environment
  usageGraph:
    legacyEdges: 17
    singleNatEdges: 21
    matchControllerRef: true
    replayDeletion: true
    acyclic: true
