  - administrator-and-deployment-principals
conditionSemantics:
  InfrastructureReady:
    owner: XEKSCluster
    means: EKS API, endpoint, identity, Fargate bootstrap, and required AWS infrastructure are ready.
    excludes:
      - CoreDNS workload readiness
      - foundation component readiness
      - runtime network UAT
  FoundationReady:
    owner: XClusterFoundation
    means: declared foundational controllers and remote configuration report their own readiness.
    excludes:
      - business application readiness
      - runtime network UAT
      - proof that Spot capacity is currently available
  NetworkUATApproved:
    owner: XClusterFoundation
    means: externally produced runtime evidence passed environment, cluster, UID, generation, actor, timestamp, and digest binding checks.
    excludes:
      - composition-executed network probing
      - static proof of runtime connectivity
  ArgoCDReady:
    owner: XClusterFoundation
    means: Argo CD Release, apps namespace RBAC, and deny-by-default AppProject report Ready.
    excludes:
      - Git repository reachability when gitOps is absent
      - business application runtime health
  RetirementEvidenceAccepted:
    owner: XClusterFoundation
    means: The next stage evidence matches both XR identities and generations, the exact transition and inventory hash, and stage-specific cleanup facts.
    excludes:
      - permission to skip a stage
      - proof supplied by XRD CEL alone
      - automatic deletion while the root XR has a deletion timestamp
  RetirementCleanupComplete:
    owner: XClusterFoundation
    means: DeleteReady evidence confirms zero dynamic capacity, ENI, and remote foundation inventory before remote authentication is released.
    excludes:
      - observation that native EKS deletion protection is already disabled
  NativeDeletionProtectionDisabled:
    owner: XEKSCluster
    means: The AWS provider observed deletionProtection false on a Ready managed EKS resource.
    excludes:
      - desired-spec intent without provider observation
  RuntimeNetworkUAT:
    owner: M2-AWS-UAT
    means: real Fargate-to-EC2, DNS, Service, webhook, and network-policy tests passed.
    staticValue: Unknown
