apiVersion: eks.aws.m.upbound.io/v1beta1
kind: Cluster
metadata:
  name: test-only-eks-control-plane
  namespace: crossplane-system
  annotations:
    crossplane.io/composition-resource-name: eks-control-plane
status:
  atProvider:
    certificateAuthority:
      - data: VEVTVC1PTkxZLUNB
    deletionProtection: true
    endpoint: https://test-only.eks.invalid
    identity:
      - oidc:
          - issuer: https://oidc.eks.test-only.invalid/id/EXAMPLE
    status: ACTIVE
    version: "1.35"
  conditions:
    - type: Ready
      status: "True"
---
apiVersion: iam.aws.m.upbound.io/v1beta1
kind: OpenIDConnectProvider
metadata:
  name: test-only-eks-oidc-provider
  namespace: crossplane-system
  annotations:
    crossplane.io/composition-resource-name: eks-oidc-provider
spec:
  forProvider:
    clientIdList:
      - sts.amazonaws.com
    url: https://oidc.eks.test-only.invalid/id/EXAMPLE
status:
  atProvider:
    arn: arn:aws:iam::000000000000:oidc-provider/oidc.eks.test-only.invalid/id/EXAMPLE
  conditions:
    - type: Ready
      status: "True"
