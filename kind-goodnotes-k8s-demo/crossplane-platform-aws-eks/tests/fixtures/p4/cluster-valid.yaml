apiVersion: platform.aws.goodnotes.io/v1alpha1
kind: XEKSCluster
metadata:
  name: eks-dev-spot-cluster
spec:
  crossplane:
    compositionUpdatePolicy: Manual
  parameters:
    access:
      adminPrincipalArn: arn:aws:iam::000000000000:role/TEST-ONLY-EksAdmin
      deploymentPrincipalArn: arn:aws:iam::000000000000:role/TEST-ONLY-EksDeployer
      publicAccessCidrs:
        - 203.0.113.10/32
    environmentRef:
      kind: XEKSEnvironment
      name: eks-dev-spot
    kubernetesVersion: "1.35"
    lifecycle:
      retirementStage: Active
      deletionProtection: true
    managementNamespace: crossplane-system
    networkRef:
      kind: XNetwork
      name: eks-dev-spot-network
    platformReleaseRef:
      kind: EnvironmentConfig
      name: test-only-platform-release
    providerConfigRef:
      kind: ClusterProviderConfig
      name: test-only-aws
    region: us-east-1
